[project]
name = "tennis-ladder-backend"
version = "0.1.0"
description = "flask api backend for a tennis ladder ranking system"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "sqlalchemy>=2.0.48",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
